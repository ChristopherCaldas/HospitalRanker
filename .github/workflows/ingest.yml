name: Ingest CMS data

# Monthly check for new CMS releases (hospital measures and Medicare
# Geographic Variation spending). Cheap when nothing changed: it reads
# metadata and only downloads releases that are new.
on:
  schedule:
    - cron: '0 14 1 * *' # 14:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      force:
        description: Re-ingest current releases even if already stored
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate --workspace=backend
      - run: npm run ingest --workspace=backend -- ${{ inputs.force && '--force' || '' }}
      # Yearly CMS archive snapshots for trends; a no-op until a new year's snapshot exists.
      - run: npm run ingest:archive --workspace=backend
      # Hospital context + finances (IPPS files each August, cost reports and SVI yearly); a no-op when unchanged.
      - run: npm run ingest:context --workspace=backend -- ${{ inputs.force && '--force' || '' }}
      # Medicare Geographic Variation is yearly; the monthly check is a no-op until a new release.
      - run: npm run ingest:spend --workspace=backend -- ${{ inputs.force && '--force' || '' }}
      # New snapshot only if a CMS release or spend version changed.
      - run: npm run analyze --workspace=backend
